# Apache Dubbo Post-Quantum Cryptography Configuration
# Version: 3.3.6-SNAPSHOT
# Date: September 23, 2025

# ============================================================================
# PQC ALGORITHM PREFERENCES (Priority Order)
# ============================================================================

# Digital Signatures (Certificate Generation)
dubbo.security.signature.preferred=Dilithium3,FALCON-512,RSA-4096
dubbo.security.signature.fallback=RSA-4096

# Hash Algorithms
dubbo.security.hash.preferred=SHA3-256,SHA-256
dubbo.security.hash.deprecated=MD5,SHA-1

# HMAC Authentication
dubbo.security.hmac.preferred=HmacSHA3-256,HmacSHA256
dubbo.security.hmac.deprecated=HmacSHA1,HmacMD5

# ============================================================================
# CRYPTOGRAPHIC PROVIDER CONFIGURATION
# ============================================================================

# BouncyCastle PQC Provider
dubbo.security.provider.pqc.enabled=true
dubbo.security.provider.pqc.class=org.bouncycastle.pqc.jcajce.provider.BouncyCastlePQCProvider
dubbo.security.provider.pqc.priority=1

# Provider Fallback Chain
dubbo.security.provider.fallback=BCPQC,BC,SunJCE,SUN

# ============================================================================
# MIGRATION SETTINGS
# ============================================================================

# Hybrid Mode (supports both PQC and classical)
dubbo.security.hybrid.enabled=true
dubbo.security.hybrid.prefer.pqc=true

# Legacy Algorithm Support (temporary during migration)
dubbo.security.legacy.rsa.enabled=true
dubbo.security.legacy.ecdsa.enabled=true
dubbo.security.legacy.md5.enabled=false

# Migration Warnings
dubbo.security.warnings.quantum.vulnerable=true
dubbo.security.warnings.deprecated.enabled=true

# ============================================================================
# PERFORMANCE TUNING
# ============================================================================

# Key Pair Generation
dubbo.security.keygen.pool.size=10
dubbo.security.keygen.pool.pregenerate=true
dubbo.security.keygen.timeout=30000

# Certificate Caching
dubbo.security.cert.cache.enabled=true
dubbo.security.cert.cache.ttl=3600
dubbo.security.cert.cache.max.size=1000

# Memory Management
dubbo.security.memory.max.heap=512m
dubbo.security.memory.cleanup.enabled=true

# ============================================================================
# SECURITY LEVELS
# ============================================================================

# PQC Security Levels (NIST categories)
# Level 1: Equivalent to AES-128 (128-bit security)
# Level 3: Equivalent to AES-192 (192-bit security)  
# Level 5: Equivalent to AES-256 (256-bit security)

dubbo.security.level.minimum=1
dubbo.security.level.preferred=3

# Algorithm Security Level Mapping
dubbo.security.algorithms.dilithium3.level=3
dubbo.security.algorithms.falcon512.level=1
dubbo.security.algorithms.rsa4096.level=0  # Quantum vulnerable
dubbo.security.algorithms.ecdsa256.level=0 # Quantum vulnerable

# ============================================================================
# COMPLIANCE AND AUDITING
# ============================================================================

# FIPS Compliance
dubbo.security.fips.enabled=false
dubbo.security.fips.only=false

# Audit Logging
dubbo.security.audit.enabled=true
dubbo.security.audit.level=INFO
dubbo.security.audit.log.keygen=true
dubbo.security.audit.log.fallback=true
dubbo.security.audit.log.deprecated=true

# Compliance Reporting
dubbo.security.compliance.pqc.report=true
dubbo.security.compliance.nist.standards=true

# ============================================================================
# MONITORING AND ALERTS
# ============================================================================

# Performance Monitoring
dubbo.security.monitoring.enabled=true
dubbo.security.monitoring.keygen.threshold=1000  # ms
dubbo.security.monitoring.memory.threshold=256   # MB

# Security Alerts
dubbo.security.alerts.quantum.threat=true
dubbo.security.alerts.deprecated.usage=true
dubbo.security.alerts.fallback.usage=true

# Health Checks
dubbo.security.healthcheck.pqc.provider=true
dubbo.security.healthcheck.keygen.performance=true
dubbo.security.healthcheck.certificate.validity=true

# ============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# ============================================================================

# Development Environment
[dev]
dubbo.security.legacy.enabled=true
dubbo.security.warnings.level=DEBUG
dubbo.security.audit.level=DEBUG

# Testing Environment  
[test]
dubbo.security.hybrid.enabled=true
dubbo.security.performance.monitoring=true
dubbo.security.compliance.validation=true

# Production Environment
[prod]
dubbo.security.legacy.enabled=false
dubbo.security.pqc.only=true
dubbo.security.audit.level=INFO
dubbo.security.alerts.enabled=true

# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================

# Certificate Size Optimization
dubbo.security.cert.compression=true
dubbo.security.cert.format=der  # Binary format for smaller size

# Network Buffer Sizes (to accommodate larger PQC certificates)
dubbo.security.network.buffer.size=16384  # 16KB
dubbo.security.network.max.packet.size=32768  # 32KB

# TLS Configuration
dubbo.security.tls.version.min=1.2
dubbo.security.tls.version.preferred=1.3
dubbo.security.tls.cipher.pqc.enabled=true

# ============================================================================
# DEVELOPMENT AND DEBUGGING
# ============================================================================

# Debug Logging
dubbo.security.debug.enabled=false
dubbo.security.debug.keygen=false
dubbo.security.debug.crypto.operations=false
dubbo.security.debug.performance=false

# Testing Support
dubbo.security.testing.mock.pqc=false
dubbo.security.testing.force.fallback=false
dubbo.security.testing.simulate.quantum.threat=false

# ============================================================================
# JVM SYSTEM PROPERTIES MAPPING
# ============================================================================

# These configuration options can also be set as JVM system properties:
# -Ddubbo.security.pqc.enabled=true
# -Ddubbo.security.provider.pqc.class=org.bouncycastle.pqc.jcajce.provider.BouncyCastlePQCProvider
# -Ddubbo.security.hybrid.enabled=true
# -Ddubbo.security.audit.enabled=true

# Security Provider Properties (Java Security)
# -Djava.security.provider.1=org.bouncycastle.pqc.jcajce.provider.BouncyCastlePQCProvider
# -Djava.security.provider.2=org.bouncycastle.jce.provider.BouncyCastleProvider

# ============================================================================
# MIGRATION CHECKLIST CONFIGURATION
# ============================================================================

# Phase 1: Preparation (Completed)
dubbo.migration.phase1.md5.removed=true
dubbo.migration.phase1.hmac.upgraded=true
dubbo.migration.phase1.dependencies.added=true

# Phase 2: Implementation (Completed)
dubbo.migration.phase2.rsa.hybrid=true
dubbo.migration.phase2.ecdsa.replaced=true
dubbo.migration.phase2.provider.registered=true

# Phase 3: Validation (In Progress)
dubbo.migration.phase3.testing.completed=false
dubbo.migration.phase3.performance.validated=false
dubbo.migration.phase3.documentation.completed=true

# Phase 4: Deployment (Ready)
dubbo.migration.phase4.ready=true
dubbo.migration.phase4.rollback.plan=true
dubbo.migration.phase4.monitoring.configured=true
